
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dhoqi — personal profile, education, experience, organization, and professional journey.">
    <meta name="author" content="Dhoqi">

    <title>Dhoqi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-grid"></div>

    <!-- HEADER -->
    <header class="navbar">
        <div class="container nav-container">

            <a href="https://dhoqi.my.id" class="logo" aria-label="Dhoqi Home">
                <span>D</span>
                Dhoqi
            </a>

            <button class="mobile-nav-toggle"
                    type="button"
                    aria-label="Buka menu navigasi"
                    aria-expanded="false"
                    aria-controls="primary-navigation">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav class="desktop-nav" id="primary-navigation" aria-label="Navigasi utama">
                <a href="#tentang">Tentang</a>
                <a href="#pendidikan">Pendidikan</a>
                <a href="#organisasi">Organisasi</a>
                <a href="#pengalaman">Pengalaman</a>
            </nav>

            <a href="https://dhoqi.my.id/kontak" class="nav-button">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                Hubungi
            </a>

        </div>
    </header>

    <!--
      KONTEN UTAMA:
      Pertahankan seluruh bagian <main id="home"> dari kode profil
      asli Bos, termasuk Hero, Data Pribadi, Pendidikan, Organisasi,
      Pengalaman, dan CTA. Jangan hapus isi tersebut.
    -->

    <!-- Tempelkan seluruh kode <main id="home">...</main> asli di sini -->

    <!-- FOOTER WAVE -->
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1440 320"
         class="footer-wave"
         aria-hidden="true">
        <path fill="#198754"
          d="M0,224L48,234.7C96,245,192,267,288,245.3C384,224,480,160,576,160C672,160,768,224,864,234.7C960,245,1056,203,1152,202.7C1248,203,1344,245,1392,266.7L1440,288L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
        </path>
    </svg>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container footer-container">
            <div>
                <strong>Dhoqi</strong>
                <p>Personal Profile</p>
            </div>

            <div class="footer-right">
                © 2023–2026 Dhoqi
            </div>
        </div>
    </footer>

    <!-- MENU MOBILE -->
    <script>
        const navToggle = document.querySelector(".mobile-nav-toggle");
        const primaryNavigation = document.querySelector("#primary-navigation");

        if (navToggle && primaryNavigation) {
            navToggle.addEventListener("click", () => {
                const isOpen = primaryNavigation.classList.toggle("is-open");

                navToggle.setAttribute("aria-expanded", String(isOpen));
                navToggle.setAttribute(
                    "aria-label",
                    isOpen ? "Tutup menu navigasi" : "Buka menu navigasi"
                );

                navToggle.innerHTML = isOpen
                    ? '<i class="fa-solid fa-xmark"></i>'
                    : '<i class="fa-solid fa-bars"></i>';
            });

            primaryNavigation.querySelectorAll("a").forEach((link) => {
                link.addEventListener("click", () => {
                    primaryNavigation.classList.remove("is-open");
                    navToggle.setAttribute("aria-expanded", "false");
                    navToggle.setAttribute("aria-label", "Buka menu navigasi");
                    navToggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
                });
            });
        }
    </script>

</body>
</html>
